<header class="relative flex items-center justify-between gap-2 px-3 sm:px-6 py-3 bg-gradient-to-r from-[#2E1233] to-[#4A1F52] shadow-sm">

  <!-- Menú (solo celular / tablet) -->
  <button type="button" (click)="abrirMenu.emit()" title="Abrir menú" aria-label="Abrir menú"
          class="lg:hidden flex items-center justify-center w-9 h-9 rounded-lg text-[#E4C766] hover:bg-white/10 shrink-0">
    <svg viewBox="0 0 24 24" fill="none" class="w-6 h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  <!-- Breadcrumb -->
  <nav class="flex items-center gap-2 text-[13px] text-[#E4C766]/80 min-w-0 flex-1">
    <a [routerLink]="['/home', rolPath, 'inicio']" class="flex items-center gap-1 hover:text-[#E4C766] transition-colors">
      <svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5Z"/>
      </svg>
      <span class="hidden sm:inline">Inicio</span>
    </a>
    <span class="text-[#E4C766]/40">/</span>
    <span class="text-[#FBF7F1] font-medium truncate">{{ titulo }}</span>
  </nav>

  <!-- Acciones derecha -->
  <div class="flex items-center gap-4">

    <!-- Notificaciones -->
    <button type="button" (click)="irANotificaciones()" title="Comunicados y mensajes"
            class="relative flex items-center justify-center w-9 h-9 rounded-full
                                  text-[#E4C766] hover:bg-white/10 transition-colors">
      <svg viewBox="0 0 24 24" fill="none" class="w-5 h-5" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 0 0-4-5.65V5a2 2 0 1 0-4 0v.35A6 6 0 0 0 6 11v3.2a2 2 0 0 1-.6 1.4L4 17h5m6 0v1a3 3 0 1 1-6 0v-1m6 0H9"/>
      </svg>
      <span *ngIf="notificaciones > 0"
            class="absolute -top-0.5 -right-0.5 flex items-center justify-center w-4 h-4
                   text-[10px] font-semibold text-white bg-[#A62639] rounded-full">
        {{ notificaciones > 99 ? '99+' : notificaciones }}
      </span>
    </button>

    <!-- Usuario -->
    <div class="relative">
      <button type="button" (click)="toggleMenu()"
              class="flex items-center gap-2 pl-1 pr-2 py-1 rounded-full hover:bg-white/10 transition-colors">
        <div class="flex items-center justify-center w-8 h-8 rounded-full border-2 border-[#C9A227] overflow-hidden
                    bg-[radial-gradient(circle_at_35%_30%,#4A1F52,#2E1233_75%)]">
          <img *ngIf="foto; else inicialesChico" [src]="foto" alt="Foto de perfil" class="w-full h-full object-cover" />
          <ng-template #inicialesChico><span class="text-[#E4C766] font-serif font-semibold text-[12px]">{{ iniciales }}</span></ng-template>
        </div>
        <span class="hidden sm:flex flex-col items-start leading-tight">
          <span class="text-[13px] font-medium text-[#FBF7F1]">{{ usuarioNombre }}</span>
          <span class="text-[11px] text-[#E4C766]/80">{{ rolVisible }}</span>
        </span>
        <svg viewBox="0 0 24 24" fill="none" class="w-3.5 h-3.5 text-[#E4C766]/70 transition-transform"
             [class.rotate-180]="menuAbierto"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </button>

      <!-- Dropdown -->
      <div *ngIf="menuAbierto"
           class="absolute right-0 mt-2 w-64 bg-[#FBF7F1] rounded-xl shadow-lg border border-[#E3D5C4]
                  overflow-hidden z-50 animate-[fadeIn_.15s_ease-out]">

        <div class="flex items-center gap-3 px-4 py-3.5 border-b border-[#E3D5C4]">
          <div class="flex items-center justify-center w-10 h-10 rounded-full border-2 border-[#C9A227] overflow-hidden
                      bg-[radial-gradient(circle_at_35%_30%,#4A1F52,#2E1233_75%)] shrink-0">
            <img *ngIf="foto; else inicialesGrande" [src]="foto" alt="Foto de perfil" class="w-full h-full object-cover" />
            <ng-template #inicialesGrande><span class="text-[#E4C766] font-serif font-semibold text-[13px]">{{ iniciales }}</span></ng-template>
          </div>
          <div class="min-w-0">
            <p class="text-[13.5px] font-semibold text-[#241521] truncate">{{ usuarioNombre }}</p>
            <p class="text-[12px] text-[#241521]/60 truncate">{{ usuarioCorreo }}</p>
          </div>
        </div>

        <nav class="py-1.5">
          <a [routerLink]="['/home', rolPath, 'perfil']" (click)="cerrarMenu()"
             class="flex items-center gap-2.5 px-4 py-2 text-[13px] text-[#241521]/85 hover:bg-[#F0E6D8] transition-colors">
            <svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/>
            </svg>
            Mi perfil
          </a>
          <a [routerLink]="['/home', rolPath, 'configuracion']" (click)="cerrarMenu()"
             class="flex items-center gap-2.5 px-4 py-2 text-[13px] text-[#241521]/85 hover:bg-[#F0E6D8] transition-colors">
            <svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
            </svg>
            Configuración
          </a>
          <a [href]="enlaceSoporte" target="_blank" rel="noopener" (click)="cerrarMenu()"
             class="flex items-center gap-2.5 px-4 py-2 text-[13px] text-[#241521]/85 hover:bg-[#F0E6D8] transition-colors">
            <svg viewBox="0 0 24 24" class="w-4 h-4 text-[#1E7A3B]" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.6-.3Z"/></svg>
            Soporte por WhatsApp
          </a>
        </nav>

        <div class="border-t border-[#E3D5C4] py-1.5">
          <button type="button" (click)="cerrarSesion()"
                  class="flex items-center gap-2.5 w-full px-4 py-2 text-[13px] font-medium text-[#A62639]
                         hover:bg-[#A62639]/10 transition-colors">
            <svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 17l5-5-5-5M20 12H9M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/>
            </svg>
            Cerrar sesión
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
